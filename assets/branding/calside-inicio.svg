<title id="title">CALSIDE — segundo fragmento del hexágono morado</title>
<desc id="desc">Solo el segundo fragmento completo del hexágono, contando desde arriba en sentido horario, es morado. Los otros cinco fragmentos son naranjas. IDE permanece morado.</desc>
